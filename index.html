<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>HDKU AI.ID</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap');
        :root {
            --bg: #0a0a14; --card: rgba(20, 20, 35, 0.8); --primary: #7b2ff7;
            --primary-glow: #f107a3; --whatsapp: #25D366; --youtube: #FF0000; --danger: #ff4757; --text: #f5f5f5;
            --text-dim: #9a9aa8; --glass-border: rgba(255, 255, 255, 0.08);
            --gold: #ffd700;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { height: 100%; height: 100dvh; }
        body {
            font-family: 'Poppins', sans-serif; background: var(--bg); color: var(--text);
            display: flex; align-items: center; justify-content: center;
            background-image: radial-gradient(circle at 15% 25%, rgba(123, 47, 247, 0.15) 0%, transparent 50%),
                              radial-gradient(circle at 85% 75%, rgba(241, 7, 163, 0.15) 0%, transparent 50%);
            overflow: hidden;
        }
        .chat-container {
            width: 100%; max-width: 750px; height: 100vh; height: 100dvh;
            background: var(--card); backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border); border-radius: 20px;
            display: flex; flex-direction: column;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
            overflow: hidden; position: relative;
        }
        .header {
            padding: 14px 20px; text-align: center; border-bottom: 1px solid var(--glass-border);
            background: rgba(0,0,0,0.2); position: relative; flex-shrink: 0;
        }
        .header h1 {
            font-size: 1.6rem; font-weight: 700; letter-spacing: 0.5px;
            background: linear-gradient(90deg, var(--primary), var(--primary-glow));
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
        }
        .header p { color: var(--text-dim); font-size: 0.8rem; margin-top: 4px; }
        .user-badge {
            position: absolute; left: 15px; top: 50%; transform: translateY(-50%);
            font-size: 0.75rem; color: var(--primary-glow); font-weight: 600;
            max-width: 120px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
        }
        .clear-btn {
            position: absolute; right: 15px; top: 50%; transform: translateY(-50%);
            background: rgba(255, 71, 87, 0.2); border: 1px solid var(--danger);
            color: var(--danger); width: 36px; height: 36px; border-radius: 10px;
            cursor: pointer; display: grid; place-items: center; transition: 0.2s;
        }
        .clear-btn:hover { background: var(--danger); color: white; }

        #chat-window {
            flex: 1 1 auto; padding: 20px; padding-bottom: 10px;
            overflow-y: auto; overflow-x: hidden;
            display: flex; flex-direction: column; gap: 12px;
            min-height: 0;
        }
        #chat-window::-webkit-scrollbar { width: 6px; }
        #chat-window::-webkit-scrollbar-thumb { background: var(--glass-border); border-radius: 10px; }

        .bubble {
            max-width: 80%; padding: 12px 16px; border-radius: 16px; font-size: 0.9rem;
            line-height: 1.5; animation: slideUp 0.25s ease; word-wrap: break-word;
        }
        .user {
            align-self: flex-end; background: linear-gradient(135deg, var(--primary), var(--primary-glow));
            color: #fff; font-weight: 500; border-bottom-right-radius: 4px;
            box-shadow: 0 4px 15px rgba(123, 47, 247, 0.3);
        }
        .ai {
            align-self: flex-start; background: rgba(255,255,255,0.04);
            border: 1px solid var(--glass-border); border-bottom-left-radius: 4px;
        }
        .ai.loading { display: flex; gap: 5px; padding: 14px 18px; }
        .ai.loading span {
            width: 6px; height: 6px; background: var(--primary); border-radius: 50%;
            animation: bounce 1.4s infinite ease-in-out both;
        }
        .ai.loading span:nth-child(1) { animation-delay: -0.32s; }
        .ai.loading span:nth-child(2) { animation-delay: -0.16s; }

        @keyframes slideUp { from { opacity: 0; transform: translateY(8px); } }
        @keyframes bounce { 0%, 80%, 100% { transform: scale(0); } 40% { transform: scale(1.0); } }

        .input-area {
            padding: 16px 20px; border-top: 1px solid var(--glass-border);
            display: flex; gap: 10px; background: rgba(0,0,0,0.3);
            flex-shrink: 0; position: relative; z-index: 10; align-items: center;
        }
        .input-wrapper { flex: 1; display: flex; gap: 8px; align-items: center; }
        #input {
            flex: 1; padding: 14px 18px; background: rgba(0, 0, 0, 0.4);
            border: 1px solid var(--glass-border); border-radius: 14px; color: var(--text);
            font-size: 0.9rem; outline: none; transition: 0.3s;
        }
        #input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(123, 47, 247, 0.2);
        }
        #send-btn, #upload-btn {
            background: linear-gradient(135deg, var(--primary), var(--primary-glow)); border: none;
            color: white; width: 48px; height: 48px; border-radius: 14px; cursor: pointer;
            display: grid; place-items: center; transition: 0.3s; flex-shrink: 0;
        }
        #send-btn:hover, #upload-btn:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(241, 7, 163, 0.4); }
        #upload-btn { background: #444; }
        #file-input { display: none; }

        /* Desain Form Login / Register Baru */
        .auth-overlay {
            position: absolute; top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(10, 10, 20, 0.92); backdrop-filter: blur(25px);
            z-index: 999; display: flex; align-items: center; justify-content: center;
            padding: 20px; animation: fadeIn 0.3s ease;
        }
        .auth-box {
            background: rgba(255, 255, 255, 0.03); border: 1px solid var(--glass-border);
            border-radius: 20px; padding: 30px 25px; max-width: 380px; width: 100%;
            box-shadow: 0 20px 50px rgba(0,0,0,0.4); text-align: center;
        }
        .auth-box h2 {
            font-size: 1.6rem; font-weight: 700; margin-bottom: 5px;
            background: linear-gradient(90deg, var(--primary), var(--primary-glow));
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
        }
        .auth-box p { color: var(--text-dim); font-size: 0.85rem; margin-bottom: 20px; }
        .auth-input-group {
            display: flex; flex-direction: column; gap: 12px; margin-bottom: 20px;
        }
        .auth-field {
            position: relative; width: 100%;
        }
        .auth-field i {
            position: absolute; left: 15px; top: 50%; transform: translateY(-50%);
            color: var(--text-dim); font-size: 0.95rem;
        }
        .auth-field input {
            width: 100%; padding: 12px 16px 12px 42px; background: rgba(0, 0, 0, 0.4);
            border: 1px solid var(--glass-border); border-radius: 12px; color: var(--text);
            font-size: 0.9rem; outline: none; transition: 0.3s;
        }
        .auth-field input:focus { border-color: var(--primary); }
        .auth-btn {
            width: 100%; padding: 12px; border-radius: 12px; border: none;
            color: white; font-weight: 600; font-size: 0.95rem; cursor: pointer;
            background: linear-gradient(135deg, var(--primary), var(--primary-glow));
            box-shadow: 0 4px 15px rgba(123, 47, 247, 0.3); transition: 0.2s;
        }
        .auth-btn:hover { transform: translateY(-1px); box-shadow: 0 6px 20px rgba(241, 7, 163, 0.4); }
        .auth-switch {
            margin-top: 15px; font-size: 0.8rem; color: var(--text-dim);
        }
        .auth-switch span {
            color: var(--primary-glow); font-weight: 600; cursor: pointer; margin-left: 4px;
        }
        .auth-switch span:hover { text-decoration: underline; }

        .result-card {
            background: rgba(0,0,0,0.3); border-radius: 12px; padding: 14px;
            border: 1px solid var(--glass-border); margin-top: 8px;
        }
        .video-preview, .image-preview {
            width: 100%; max-height: 300px; object-fit: cover;
            border-radius: 10px; margin-bottom: 10px;
        }
        .image-preview.transparent-bg {
            object-fit: contain;
            background-image: linear-gradient(45deg, #1d1d1d 25%, transparent 25%), 
                              linear-gradient(-45deg, #1d1d1d 25%, transparent 25%), 
                              linear-gradient(45deg, transparent 75%, #1d1d1d 75%), 
                              linear-gradient(-45deg, transparent 75%, #1d1d1d 75%);
            background-size: 20px 20px;
            background-position: 0 0, 0 10px, 10px -10px, -10px 0px;
        }
        .user-info {
            display: flex; align-items: center; gap: 10px; margin-bottom: 12px;
        }
        .user-info img { width: 40px; height: 40px; border-radius: 50%; border: 2px solid var(--primary); }
        .tt-stats {
            display: flex; justify-content: space-around; text-align: center;
            font-size: 12px; margin: 15px 0; padding: 10px 0;
            border-top: 1px solid #444; border-bottom: 1px solid #444;
        }
        .tt-stats i { font-size: 16px; margin-bottom: 4px; color: #fe2c55; }
        .desc-box {
            background: rgba(0, 0, 0, 0.5); padding: 10px; border-radius: 8px;
            font-size: 0.8rem; max-height: 80px; overflow-y: auto; white-space: pre-wrap;
            border: 1px solid rgba(255,255,255,0.05); margin-bottom: 10px;
        }
        .video-info { display: flex; justify-content: space-between; font-size: 0.75rem; color: var(--text-dim); margin-bottom: 10px; padding: 0 4px; }
        .action-btns { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 10px; }
        .quality-btns { display: grid; grid-template-columns: repeat(auto-fit, minmax(80px, 1fr)); gap: 8px; margin-bottom: 10px; }
        .btn-small {
            padding: 10px; border-radius: 8px; border: none; font-weight: 600;
            cursor: pointer; color: white; display: flex; align-items: center;
            justify-content: center; gap: 6px; font-size: 0.85rem; transition: 0.2s;
        }
        .btn-copy { background: #333; }
        .btn-copy:hover { background: #444; }
        .btn-dl { background: var(--whatsapp); }
        .btn-dl-yt { background: var(--youtube); }
        .btn-dl:hover,.btn-dl-yt:hover { opacity: 0.9; transform: translateY(-1px); }
        .btn-dl:disabled,.btn-dl-yt:disabled { opacity: 0.6; cursor: not-allowed; }
        .btn-quality { background: #444; font-size: 0.8rem; padding: 8px; }
        .btn-quality:hover { background: var(--primary); }

        .photo-item {
            display: flex; align-items: center; gap: 10px; margin-top: 8px;
            background: rgba(255,255,255,0.03); padding: 8px; border-radius: 8px;
        }
        .photo-thumb { width: 45px; height: 45px; object-fit: cover; border-radius: 6px; }

        code { background: rgba(123,47,247,0.2); padding: 2px 6px; border-radius: 4px; font-size: 0.85em; }
        .wa-link { color: var(--whatsapp); text-decoration: none; font-weight: 600; transition: 0.2s; }
        .wa-link:hover { text-decoration: underline; text-shadow: 0 0 8px rgba(37, 211, 102, 0.6); }

        .queue-notice { background: rgba(139, 92, 246, 0.15); border: 1px solid var(--primary); border-radius: 12px; padding: 14px; text-align: center; margin-top: 8px; }
        .queue-notice b { color: var(--primary-glow); }
        .limit-notice { background: rgba(255, 71, 87, 0.15); border: 1px solid var(--danger); border-radius: 12px; padding: 14px; text-align: center; margin-top: 8px; }
        .limit-notice b { color: var(--danger); }

        .button-container { margin-top: 10px; display: flex; gap: 8px; }
        .choice-btn {
            background: rgba(123, 47, 247, 0.3); border: 1px solid var(--primary);
            color: white; padding: 6px 14px; border-radius: 20px; cursor: pointer;
            font-size: 0.85rem; transition: all 0.2s;
        }
        .choice-btn:hover { background: var(--primary); transform: scale(1.05); }

        #maintenance-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(10, 10, 20, 0.7); backdrop-filter: blur(12px);
            z-index: 9999; display: none; align-items: center; justify-content: center;
        }
        .maintenance-box {
            background: var(--card); border: 1px solid var(--glass-border);
            border-radius: 20px; padding: 40px 30px; text-align: center;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.6); max-width: 400px; width: 90%;
        }
        .maintenance-box i {
            font-size: 3rem; margin-bottom: 20px;
            background: linear-gradient(90deg, var(--primary), var(--primary-glow));
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            animation: spin 3s linear infinite;
        }
        .maintenance-box h2 {
            font-size: 1.5rem; font-weight: 700; margin-bottom: 10px;
            background: linear-gradient(90deg, var(--primary), var(--primary-glow));
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
        }
        .maintenance-box p { color: var(--text-dim); font-size: 0.9rem; margin-bottom: 25px; }
        .loading-dots { display: flex; gap: 8px; justify-content: center; }
        .loading-dots span {
            width: 10px; height: 10px; background: var(--primary); border-radius: 50%;
            animation: bounce 1.4s infinite ease-in-out both;
        }
        .loading-dots span:nth-child(1) { animation-delay: -0.32s; }
        .loading-dots span:nth-child(2) { animation-delay: -0.16s; }

        @media (max-width: 600px) {
            body { padding: 0; }
            .chat-container { height: 100vh; height: 100dvh; border-radius: 0; border: none; }
            .bubble { max-width: 90%; }
            .input-area { padding: 12px; padding-bottom: max(12px, env(safe-area-inset-bottom)); }
            #input { padding: 12px 14px; }
            #send-btn, #upload-btn { width: 44px; height: 44px; }
            .action-btns { grid-template-columns: 1fr; }
            .user-badge { display: none; }
        }
    </style>
</head>
<body>
    <div class="chat-container">
        
        <div class="auth-overlay" id="authOverlay" style="display:none;">
            <div class="auth-box" id="loginPanel">
                <h2>🔐 Masuk Akun HDKU</h2>
                <p>Silakan masukkan nama & sandi untuk melanjutkan</p>
                <div class="auth-input-group">
                    <div class="auth-field">
                        <i class="fa-solid fa-user"></i>
                        <input type="text" id="loginName" placeholder="Masukkan Nama Lu..." autocomplete="off">
                    </div>
                    <div class="auth-field">
                        <i class="fa-solid fa-lock"></i>
                        <input type="password" id="loginPass" placeholder="Masukkan Sandi Lu...">
                    </div>
                </div>
                <button class="auth-btn" onclick="prosesLogin()">Masuk Sekarang</button>
                <div class="auth-switch">Belum punya akun?<span onclick="switchAuth('register')">Buat Akun Baru</span></div>
            </div>

            <div class="auth-box" id="registerPanel" style="display:none;">
                <h2>✨ Buat Akun Baru</h2>
                <p>Daftarkan akunmu gratis di sistem cloud pusat</p>
                <div class="auth-input-group">
                    <div class="auth-field">
                        <i class="fa-solid fa-user"></i>
                        <input type="text" id="regName" placeholder="Tulis Nama Akun Baru..." autocomplete="off">
                    </div>
                    <div class="auth-field">
                        <i class="fa-solid fa-lock"></i>
                        <input type="password" id="regPass" placeholder="Bikin Sandi Akun...">
                    </div>
                </div>
                <button class="auth-btn" onclick="prosesRegister()">Daftar Akun</button>
                <div class="auth-switch">Sudah punya akun?<span onclick="switchAuth('login')">Masuk Di Sini</span></div>
            </div>
        </div>

        <div class="header">
            <div class="user-badge" id="userBadge"></div>
            <h1>HDKU AI</h1>
            <p>Ketik <code>.menu</code> untuk melihat semua fitur</p>
            <button class="clear-btn" onclick="clearChat()" title="Hapus Riwayat">
                <i class="fa-solid fa-trash"></i>
            </button>
        </div>
        
        <div id="chat-window"></div>
        
        <div class="input-area">
            <div class="input-wrapper">
                <button id="upload-btn" onclick="document.getElementById('file-input').click()"><i class="fa-solid fa-image"></i></button>
                <input type="file" id="file-input" accept="image/*">
                <input type="text" id="input" placeholder="Ketik .me / .cekprem / .menu..." autocomplete="off">
            </div>
            <button id="send-btn"><i class="fa-solid fa-paper-plane"></i></button>
        </div>
    </div>

    <div id="maintenance-overlay">
        <div class="maintenance-box">
            <i class="fa-solid fa-screwdriver-wrench"></i>
            <h2>HDKU AI SEDANG DOWN</h2>
            <p>HARAP TUNGGU BEBERAPA SAAT</p>
            <div class="loading-dots">
                <span></span><span></span>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, set, get, child } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        const firebaseConfig = {
          apiKey: "AIzaSyCihx8HOl876uhEgJ5k5cyEK40CCjvx6G8",
          authDomain: "hdku-ai.firebaseapp.com",
          databaseURL: "https://hdku-ai-default-rtdb.asia-southeast1.firebasedatabase.app",
          projectId: "hdku-ai",
          storageBucket: "hdku-ai.firebasestorage.app",
          messagingSenderId: "150138921754",
          appId: "1:150138921754:web:603ca2a964797004c302a3",
          measurementId: "G-Y2L3N628YH"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        window.firebaseDb = db;
        window.dbRef = ref(db);
        window.dbSet = set;
        window.dbGet = get;
        window.dbChild = child;
        window.dbRefCreate = ref;

        window.initHDKU();
    </script>

    <script>
        const chatWindow = document.getElementById('chat-window');
        const input = document.getElementById('input');
        const sendBtn = document.getElementById('send-btn');
        const fileInput = document.getElementById('file-input');
        const CHAT_KEY = 'hdku_chat_history';
        const USER_KEY = 'hdku_user_data';
        const REDEEMED_KEY = 'hdku_used_codes';
        const BONUS_LIMIT_KEY = 'hdku_bonus_limit';

        let isDownloading = false;
        let queueInterval = null;

        const LIMIT_KEY = 'hdku_daily_limit';
        const RESET_HOUR = 15;

        let userData = { nama: null, sandi: null, status: 'Reguler', expiredTime: null };
        let lastUploadedImage = null; 

        let spamCount = 0;
        let spamTimer = null;
        let isBanned = false;
        let banEndTime = 0;
        const SPAM_LIMIT = 5; 
        const SPAM_WINDOW = 10000; 
        const CHAT_BAN_DURATION = 300000; 
        const TIKWM_BAN_DURATION = 60000; 

        const PREMIUM_CODES = {
            "HDKUCODE12007G287": { label: "Premium 1 Bulan", days: 30 },
            "HDKUCODE14267LGJEY": { label: "Premium 1 Minggu", days: 7 },
            "HDKUCODE819186GSNALG": { label: "Premium 1 Hari", days: 1 }
        };

        const LIMIT_CODES = [
            "HDKULIMIT01", "HDKULIMIT02", "HDKULIMIT03", "HDKULIMIT04", "HDKULIMIT05",
            "HDKULIMIT06", "HDKULIMIT07", "HDKULIMIT08", "HDKULIMIT09", "HDKULIMIT10"
        ];

        function switchAuth(type) {
            if (type === 'register') {
                document.getElementById('loginPanel').style.display = 'none';
                document.getElementById('registerPanel').style.display = 'block';
            } else {
                document.getElementById('registerPanel').style.display = 'none';
                document.getElementById('loginPanel').style.display = 'block';
            }
        }

        // FUNGSI DAFTAR AKUN BARU (REGISTER FORM)
        async function prosesRegister() {
            const nameInput = document.getElementById('regName').value.trim();
            const passInput = document.getElementById('regPass').value.trim();

            if (!nameInput || !passInput) {
                alert('Nama dan Sandi wajib diisi bray!');
                return;
            }
            if (nameInput.length < 3) {
                alert('Nama minimal harus 3 karakter!');
                return;
            }

            if (!window.firebaseDb) {
                alert('Firebase belum siap, tunggu sebentar bray!');
                return;
            }

            const cleanKey = nameInput.replace(/[\.\#\$\[\]]/g, "-");

            try {
                // Cek dulu apakah nama user sudah terdaftar di Firebase
                const snapshot = await window.dbGet(window.dbChild(window.dbRef, `users/${cleanKey}`));
                if (snapshot.exists()) {
                    alert('Nama ini sudah dipakai orang lain! Coba nama lain.');
                    return;
                }

                // Masukkan data baru ke cloud
                const newAccount = {
                    nama: nameInput,
                    sandi: passInput,
                    status: 'Reguler',
                    expiredTime: null
                };

                await window.dbSet(window.dbRefCreate(window.firebaseDb, 'users/' + cleanKey), newAccount);
                
                userData = newAccount;
                localStorage.setItem(USER_KEY, JSON.stringify(userData));
                
                document.getElementById('authOverlay').style.display = 'none';
                document.getElementById('userBadge').textContent = `👋 ${userData.nama}`;
                
                addBubble(`🎉 <b>Pendaftaran Berhasil!</b> Akun barumu dengan nama <b>${userData.nama}</b> sukses diamankan di cloud database pusat!`, 'ai');
                showWelcome();

            } catch (err) {
                alert('Gagal daftar ke database cloud. Cek koneksi internetmu!');
                console.error(err);
            }
        }

        // FUNGSI LOGIN UTAMA (LOGIN FORM)
        async function prosesLogin() {
            const nameInput = document.getElementById('loginName').value.trim();
            const passInput = document.getElementById('loginPass').value.trim();

            if (!nameInput || !passInput) {
                alert('Nama dan Sandi harus diisi bray!');
                return;
            }

            if (!window.firebaseDb) {
                alert('Sistem Firebase belum siap!');
                return;
            }

            const cleanKey = nameInput.replace(/[\.\#\$\[\]]/g, "-");

            try {
                const snapshot = await window.dbGet(window.dbChild(window.dbRef, `users/${cleanKey}`));
                if (!snapshot.exists()) {
                    alert('Akun tidak ditemukan! Klik "Buat Akun Baru" di bawah jika belum mendaftar.');
                    return;
                }

                const cloudData = snapshot.val();
                if (cloudData.sandi !== passInput) {
                    alert('Sandi salah boskuh! Periksa kembali huruf besar/kecilnya.');
                    return;
                }

                // Sukses Login
                userData = cloudData;
                localStorage.setItem(USER_KEY, JSON.stringify(userData));
                
                document.getElementById('authOverlay').style.display = 'none';
                let badgeIcon = userData.status === 'Premium' ? '👑' : '👋';
                document.getElementById('userBadge').textContent = `${badgeIcon} ${userData.nama}`;
                
                addBubble(`🔓 <b>Berhasil Masuk!</b> Selamat datang kembali <b>${userData.nama}</b>. Data cloud kamu sukses dimuat secara aman!`, 'ai');
                showWelcome();

        function formatDuration(sec) {
            const h = Math.floor(sec / 3600);
            const m = Math.floor((sec % 3600) / 60);
            const s = sec % 60;
            return h > 0? `${h}:${m.toString().padStart(2,'0')}:${s.toString().padStart(2,'0')}` : `${m}:${s.toString().padStart(2,'0')}`;
        }

        function formatAngka(num) {
            if (!num) return '0';
            if (num >= 1000000) return (num / 1000000).toFixed(1) + 'M';
            if (num >= 1000) return (num / 1000).toFixed(1) + 'K';
            return num.toString();
        }

        function getResetTime() {
            const now = new Date();
            const reset = new Date();
            reset.setHours(RESET_HOUR, 0, 0, 0);
            if (now >= reset) reset.setDate(reset.getDate() + 1);
            return reset;
        }

        function checkDailyLimit() {
            const now = new Date();
            const data = JSON.parse(localStorage.getItem(LIMIT_KEY) || '{}');
            const maxRequestBase = getMaxRequests();
            const bonus = getBonusLimit();
            const totalMaxRequests = maxRequestBase + bonus;

            if (!data.resetTime || now >= new Date(data.resetTime)) {
                const newData = { count: 0, resetTime: getResetTime().toISOString() };
                localStorage.setItem(LIMIT_KEY, JSON.stringify(newData));
                return { allowed: true, remaining: totalMaxRequests, used: 0, max: totalMaxRequests, resetTime: newData.resetTime };
            }
            const remaining = totalMaxRequests - (data.count || 0);
            return {
                allowed: remaining > 0,
                remaining: Math.max(0, remaining),
                used: data.count || 0,
                max: totalMaxRequests,
                resetTime: data.resetTime
            };
        }

        function incrementLimit(amount = 1) {
            const data = JSON.parse(localStorage.getItem(LIMIT_KEY) || '{}');
            data.count = (data.count || 0) + amount;
            if (!data.resetTime) data.resetTime = getResetTime().toISOString();
            localStorage.setItem(LIMIT_KEY, JSON.stringify(data));
        }

        function formatResetTime(isoString) {
            const date = new Date(isoString);
            const jam = date.getHours().toString().padStart(2, '0');
            const menit = date.getMinutes().toString().padStart(2, '0');
            return `${jam}:${menit}`;
        }

        async function autoDownload(url, name, btnElement) {
            const btn = btnElement; const oldTxt = btn.innerHTML;
            try {
                btn.disabled = true; btn.innerHTML = '<i class="fa-solid fa-circle-notch fa-spin"></i>...';
                let targetUrl = url;
                if (url.includes('bintangapi.full.diskon.cloud') || url.includes('ucarecdn.com')) targetUrl = `https://api.allorigins.win/raw?url=${encodeURIComponent(url)}`;
                const response = await fetch(targetUrl); if (!response.ok) throw new Error();
                const blob = await response.blob(); const blobUrl = window.URL.createObjectURL(blob);
                const a = document.createElement('a'); a.href = blobUrl; a.download = name; document.body.appendChild(a); a.click(); document.body.removeChild(a); window.URL.revokeObjectURL(blobUrl);
                btn.innerHTML = '<i class="fa-solid fa-check"></i> Sukses';
            } catch (e) {
                alert('Tahan gambarnya/video lalu klik "Simpan" manual jika otomatis gagal bray!'); btn.innerHTML = oldTxt;
            } finally { setTimeout(() => { btn.disabled = false; btn.innerHTML = oldTxt; }, 2000); }
        }

        async function downloadAllPhotos(images, id, btnElement) {
            const btn = btnElement; const oldTxt = btn.innerHTML;
            try {
                btn.disabled = true; btn.innerHTML = 'Downloading...';
                for (let i = 0; i < images.length; i++) { await autoDownload(images[i], `Slide-${id}-${i + 1}.jpg`, btn); await new Promise(r => setTimeout(r, 400)); }
                btn.innerHTML = 'Selesai ✨';
            } catch (e) { alert('Gagal download massal'); }
            finally { setTimeout(() => { btn.disabled = false; btn.innerHTML = oldTxt; }, 2000); }
        }

        function copyText(elementId, btnElement) {
            const txt = document.getElementById(elementId).innerText; const btn = btnElement; const originalTxt = btn.innerHTML;
            navigator.clipboard.writeText(txt).then(() => {
                btn.innerHTML = 'Tersalin!'; setTimeout(() => { btn.innerHTML = originalTxt; }, 2000);
            }).catch(() => {
                const t = document.createElement("textarea"); t.value = txt; document.body.appendChild(t); t.select(); document.execCommand('copy'); document.body.removeChild(t);
                btn.innerHTML = 'Tersalin!'; setTimeout(() => { btn.innerHTML = originalTxt; }, 2000);
            });
        }

        fileInput.addEventListener('change', (e) => {
